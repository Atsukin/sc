<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B案 夜の明かり｜名取LP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #040000;
    --yellow: #F5E528;
    --white: #FFFFFF;
    --mist: rgba(255, 255, 255, .72);
    --rule: rgba(255, 255, 255, .22);
    --img: url("../../../../src-next/public/images/solar/japanese-roof.webp");
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--ink); color: var(--white); font-family: "Zen Kaku Gothic New", sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  a:focus-visible { outline: 2px solid var(--yellow); outline-offset: 3px; }

  .fv { position: relative; min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; isolation: isolate; }
  .fv::before { content: ""; position: absolute; inset: 0; z-index: -2; background: var(--img) center 30% / cover no-repeat; filter: grayscale(.35) brightness(.55) contrast(1.1); }
  .fv::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgba(4,0,0,.82) 0%, rgba(4,0,0,.45) 55%, rgba(4,0,0,.15) 100%); }

  /* ロゴの菱形を拡大して切り取った線。この案で唯一の装飾 */
  .mark { position: absolute; z-index: -1; right: -16vw; top: 120px; height: 108vh; }
  .mark polygon { fill: none; stroke: var(--yellow); stroke-width: 1.6; vector-effect: non-scaling-stroke; }
  .mark .lower { stroke: #F7EE80; opacity: .7; }

  header { display: flex; align-items: center; gap: 40px; padding: 24px 56px; }
  header img { height: 34px; display: block; }
  header nav { display: flex; gap: 32px; margin-left: auto; font-size: 14px; font-weight: 500; color: var(--mist); }
  header nav a:hover { color: var(--white); }
  .tel { font-size: 20px; font-weight: 700; letter-spacing: .02em; }
  .tel small { display: block; font-size: 11px; font-weight: 400; color: var(--mist); }

  .copy { align-self: center; padding: 40px 56px 64px; max-width: 900px; }
  h1 { font-size: 15px; font-weight: 500; color: var(--mist); letter-spacing: .06em; }
  .lead { font-size: clamp(48px, 6.4vw, 96px); font-weight: 900; line-height: 1.2; letter-spacing: -.01em; margin-top: 20px; font-feature-settings: "palt"; }
  .body { font-size: 16px; line-height: 2; color: var(--mist); margin-top: 28px; max-width: 32em; }
  .actions { display: flex; align-items: center; gap: 32px; margin-top: 44px; flex-wrap: wrap; }
  .btn { display: inline-block; background: var(--yellow); color: var(--ink); font-size: 16px; font-weight: 700; padding: 20px 40px; }
  .btn:hover { background: #fff36a; }
  .phone { font-size: 15px; font-weight: 500; border-bottom: 1px solid var(--white); padding-bottom: 3px; }

  .facts { display: flex; border-top: 1px solid var(--rule); padding: 0 56px; }
  .facts div { padding: 20px 48px 22px 0; margin-right: 48px; border-right: 1px solid var(--rule); }
  .facts div:last-child { border-right: 0; }
  .facts dt { font-size: 12px; color: var(--mist); }
  .facts dd { font-size: 18px; font-weight: 700; margin-top: 4px; }

  @media (max-width: 860px) {
    .fv::after { background: linear-gradient(180deg, rgba(4,0,0,.35) 0%, rgba(4,0,0,.82) 55%, rgba(4,0,0,.92) 100%); }
    .mark { right: -60vw; top: 0; height: 70vh; transform: none; }
    header { padding: 14px 16px; gap: 16px; }
    header img { height: 28px; }
    header nav { display: none; }
    .tel { margin-left: auto; font-size: 16px; }
    .copy { align-self: end; padding: 120px 16px 28px; }
    .lead { font-size: 40px; margin-top: 12px; }
    .body { font-size: 15px; margin-top: 16px; }
    .actions { margin-top: 28px; gap: 20px; }
    .btn { width: 100%; text-align: center; }
    .facts { flex-direction: column; padding: 0 16px; }
    .facts div { margin: 0; padding: 12px 0; border-right: 0; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: baseline; }
    .facts div:first-child { border-top: 0; }
    .facts dd { margin: 0; font-size: 16px; }
  }
</style>
</head>
<body>
<div class="fv">
  <svg class="mark" viewBox="0 0 785 789" aria-hidden="true">
    <polygon points="391,0 633,0 242,390 0,390"/>
    <polygon points="523,129 785,390 543,390 403,250"/>
    <polygon class="lower" points="0,399 242,399 382,539 262,659"/>
    <polygon class="lower" points="543,399 785,399 394,789 152,789"/>
  </svg>

  <header>
    <img src="../../../../src-next/public/images/solar/sc-logo-white.png" alt="株式会社SC">
    <nav><a href="#">補助金</a><a href="#">導入の流れ</a><a href="#">よくある質問</a></nav>
    <a class="tel" href="tel:0223548345"><small>9:00〜21:00 年中無休</small>022-354-8345</a>
  </header>

  <div class="copy">
    <h1>名取市の太陽光発電・蓄電池</h1>
    <p class="lead">停電の夜も、<br>家に明かりを。</p>
    <p class="body">昼につくった電気を蓄電池にためて、夜や停電のときに使う。名取市の補助金は、太陽光と蓄電池を一緒に設置すると対象になります。</p>
    <div class="actions">
      <a class="btn" href="#">補助金の対象か相談する</a>
      <a class="phone" href="tel:0223548345">電話で相談 022-354-8345</a>
    </div>
  </div>

  <dl class="facts">
    <div><dt>名取市の補助（太陽光＋蓄電池）</dt><dd>1件 10万円</dd></div>
    <div><dt>設置・電力受給開始の期限</dt><dd>2026年12月31日</dd></div>
    <div><dt>本社</dt><dd>名取市手倉田</dd></div>
  </dl>
</div>
</body>
</html>
